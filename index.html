<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>EPS Command Board</title>

<style>
:root{
 --red:#DA291C;
 --orange:#F58220;
 --yellow:#FFD100;
 --green:#4CAF50;
 --panel:#f1f1f1;
 --dark:#1d1d1d;
 --muted:#666;
 --border:#bdbdbd;
 --shadow:0 1px 0 rgba(0,0,0,0.06);
}

*{ box-sizing:border-box; }

html,body{
 margin:0;
 padding:0;
 font-family:Segoe UI,sans-serif;
 background:#fff;
 color:#222;
}

body{
 min-height:100vh;
}

.header{
 padding:20px 16px 12px 16px;
 border-bottom:1px solid #ddd;
}

.header-top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:16px;
 flex-wrap:wrap;
}

h1{
 margin:0;
 font-size:clamp(2rem, 2.4vw, 3rem);
 letter-spacing:0.04em;
 font-weight:800;
}

.stats{
 display:flex;
 gap:12px;
 margin-top:14px;
 flex-wrap:wrap;
}

.stat{
 background:#f5f5f5;
 padding:10px 16px;
 border-radius:8px;
 border:1px solid #ddd;
 font-size:14px;
}

.search-wrap{
 display:flex;
 gap:12px;
 align-items:center;
 margin-top:18px;
 flex-wrap:wrap;
}

.search-box{
 flex:1 1 700px;
 min-width:220px;
 width:100%;
 max-width:none;
 padding:13px 14px;
 font-size:15px;
 border:2px solid #222;
 border-radius:8px;
 background:white;
}

.search-box::placeholder{ color:#727272; }

.search-actions{
 display:flex;
 gap:8px;
}

.search-actions button,
.badge-btn,
.column-add-btn,
.card-button{
 font-size:13px;
 border-radius:6px;
 border:1px solid #222;
 cursor:pointer;
}

.search-actions button{
 padding:11px 18px;
 background:#222;
 color:white;
 border:1px solid #222;
 font-weight:700;
}

.search-actions button:hover{ background:#333; }

.search-panel{
 margin-top:20px;
 background:#f0f0f0;
 border:2px solid #222;
 border-radius:10px;
 padding:16px;
 max-height:420px;
 overflow-y:auto;
}

.search-panel h3{
 margin:0 0 12px 0;
 font-size:18px;
}

.search-results{ display:flex; flex-direction:column; gap:12px; }

.search-item{
 background:white;
 border:2px solid #ddd;
 border-radius:8px;
 padding:14px;
}

.search-item-header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 margin-bottom:10px;
 flex-wrap:wrap;
}

.search-status{
 font-weight:bold;
 padding:6px 12px;
 border-radius:18px;
 font-size:12px;
 white-space:nowrap;
}

.search-status.current{ background:#dfeeff; color:#0c4ca3; }
.search-status.resolved{ background:#dff7e8; color:#1d6e3b; }

.search-line-badge{
 background:#222;
 color:white;
 padding:4px 10px;
 border-radius:4px;
 font-size:12px;
 font-weight:bold;
}

.search-item-title{
 font-size:16px;
 font-weight:bold;
 margin-bottom:8px;
}

.search-meta{
 color:#444;
 font-size:13px;
 line-height:1.8;
}

.search-meta div{ margin-bottom:4px; }

.search-item-actions{ margin-top:12px; }
.search-item-actions button{
 background:#222;
 color:white;
 padding:10px 16px;
 font-weight:bold;
 border:1px solid #222;
}

.search-empty{
 background:white;
 border:2px dashed #999;
 border-radius:8px;
 padding:16px;
 color:#666;
 text-align:center;
}

.board-wrap{
 padding:0 16px 18px 16px;
}

.board{
 display:flex;
 gap:15px;
 flex-wrap:wrap;
 align-items:flex-start;
 width:100%;
}

.column{
 flex:1 1 min(24%, 380px);
 min-width:250px;
 max-width:100%;
 border:1px solid #d3d3d3;
 border-radius:12px;
 background:#fafafa;
 overflow:hidden;
}

.column-header{
 padding:12px 10px;
 color:white;
 font-weight:bold;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
 flex-wrap:wrap;
}

.header-title{
 font-size:18px;
 font-weight:800;
}

.header-badges{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
}

.badge-btn{
 background:rgba(255,255,255,0.24);
 border:1px solid rgba(255,255,255,0.7);
 color:white;
 padding:6px 10px;
 font-weight:700;
}

.badge-btn.active{
 background:rgba(0,0,0,0.18);
 box-shadow:inset 0 0 0 1px rgba(255,255,255,0.7);
}

.column-add-btn{
 background:#fff;
 color:#222;
 border:1px solid rgba(0,0,0,0.2);
 padding:6px 10px;
 font-weight:700;
}

.column-body{ padding:6px 10px 10px 10px; }

.card{
 background:white;
 margin:10px 0;
 border:1px solid #ddd;
 border-radius:8px;
 padding:10px;
 box-shadow:var(--shadow);
}

.card-title{
 font-weight:bold;
 margin-bottom:8px;
}

.card-info{
 font-size:14px;
 margin-bottom:8px;
 color:#555;
 line-height:1.5;
}

.meetings{
 margin-top:10px;
 border-top:1px solid #eee;
 padding-top:8px;
}

.meeting-item{
 background:#f9f9f9;
 padding:8px;
 margin:5px 0;
 border-radius:6px;
 font-size:12px;
 border-left:3px solid var(--orange);
}

.meeting-label{ font-weight:bold; }
.meeting-detail{ color:#666; margin-top:3px; }

.actions{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }

.card-button{
 padding:7px 10px;
 background:#ececec;
 border:1px solid #d7d7d7;
 color:#222;
}

.card-button.green{ background:#4CAF50; color:white; border-color:#4CAF50; }
.card-button.blue{ background:#2d6cdf; color:white; border-color:#2d6cdf; }

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.7);
 overflow:auto;
 z-index:1000;
}

.modal-content{
 max-width:900px;
 margin:40px auto;
 background:white;
 padding:20px;
 border-radius:8px;
}

input,textarea{
 width:100%;
 padding:8px;
 margin-bottom:10px;
 box-sizing:border-box;
}

.visit{
 margin-top:10px;
 background:#f7f7f7;
 padding:10px;
 border-left:4px solid var(--red);
}

.empty-state{
 background:#f8f8f8;
 border:1px solid #ddd;
 border-radius:8px;
 padding:18px;
 text-align:center;
 color:#666;
 margin:10px 0;
}

.red{background:var(--red);} .orange{background:var(--orange);} .yellow{background:var(--yellow); color:#111;} .green{background:var(--green);}

@media (max-width: 1024px){
  .column{ flex:1 1 45%; }
}

@media (max-width: 720px){
  .header{ padding:16px 12px 10px 12px; }
  .board-wrap{ padding:0 12px 14px 12px; }
  .search-wrap{ flex-direction:column; align-items:stretch; }
  .search-actions{ width:100%; }
  .search-actions button{ flex:1; }
  .column{ flex:1 1 100%; min-width:0; }
  .header-badges{ width:100%; }
  .badge-btn{ flex:1; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>EPS COMMAND BOARD</h1>
  </div>

  <div class="stats">
    <div class="stat">Current Issues: <span id="issueCount">0</span></div>
    <div class="stat">Issues Resolved: <span id="resolvedCount">0</span></div>
    <div class="stat">Visits This Week: <span id="visitCount">0</span></div>
  </div>

  <div class="search-wrap">
    <input id="searchInput" class="search-box" type="text" placeholder="🔍 Search everything (ESN, title, description, notes...)" />
    <div class="search-actions">
      <button onclick="runSearch()">Search</button>
      <button onclick="clearSearch()">Clear</button>
    </div>
  </div>

  <div class="search-panel">
    <h3>📋 Search Results</h3>
    <div id="searchResults" class="search-results"></div>
  </div>
</div>

<div class="board-wrap">
  <div id="board" class="board"></div>
</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <div id="modalContent"></div>
  </div>
</div>

<script>
const CURRENT_VIEW = "current";
const SOLVED_VIEW = "solved";
const ALL_VIEW = "all";

let activeFilter = localStorage.getItem("epsActiveFilter") || ALL_VIEW;
let activeLine = localStorage.getItem("epsActiveLine") || null;
let searchResults = [];

let lines = JSON.parse(localStorage.getItem("epsLines")) || [
  { name:"19L", color:"red", issues:[], resolvedIssues:[] },
  { name:"30L", color:"orange", issues:[], resolvedIssues:[] },
  { name:"95L", color:"yellow", issues:[], resolvedIssues:[] },
  { name:"15L", color:"green", issues:[], resolvedIssues:[] }
];

function normalizeLines(){
  lines = lines.map(line => ({
    name: line.name,
    color: line.color,
    issues: Array.isArray(line.issues) ? line.issues : [],
    resolvedIssues: Array.isArray(line.resolvedIssues) ? line.resolvedIssues : []
  }));
}

normalizeLines();

function saveData(){
  localStorage.setItem("epsLines", JSON.stringify(lines));
  localStorage.setItem("epsActiveFilter", activeFilter);
  localStorage.setItem("epsActiveLine", activeLine || "");
  const flattenedResolved = lines.flatMap(line => line.resolvedIssues.map(issue => ({ ...issue, line: line.name })));
  localStorage.setItem("epsResolvedIssues", JSON.stringify(flattenedResolved));
}

function buildSearchableText(issue){
  let text = [
    issue.title || '',
    issue.esn || '',
    issue.station || '',
    issue.description || '',
    issue.foundHow || '',
    issue.dateFound || ''
  ].join(' ');

  if (issue.visits && Array.isArray(issue.visits)) {
    issue.visits.forEach(visit => {
      text += ' ' + (visit.date || '') + ' ' + (visit.people || '') + ' ' + (visit.location || '') + ' ' + (visit.notes || '');
    });
  }

  return text.toLowerCase();
}

function runSearch(){
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!query) {
    searchResults = [];
    renderSearchResults();
    return;
  }

  searchResults = [];

  lines.forEach((line, lineIndex) => {
    line.issues.forEach((issue, issueIndex) => {
      if (buildSearchableText(issue).includes(query)) {
        searchResults.push({ status:'Current', lineName:line.name, lineIndex, issueIndex, issue, isResolved:false });
      }
    });

    line.resolvedIssues.forEach((issue, issueIndex) => {
      if (buildSearchableText(issue).includes(query)) {
        searchResults.push({ status:'Resolved', lineName:line.name, lineIndex, issueIndex, issue, isResolved:true });
      }
    });
  });

  renderSearchResults();
}

function clearSearch(){
  document.getElementById('searchInput').value = '';
  searchResults = [];
  renderSearchResults();
}

function renderSearchResults(){
  const container = document.getElementById('searchResults');
  if (!searchResults || searchResults.length === 0) {
    container.innerHTML = '<div class="search-empty">No results found. Try searching for an ESN, issue title, description, station, or any note text.</div>';
    return;
  }

  let html = '';
  searchResults.forEach((result) => {
    const issue = result.issue;
    const statusClass = result.status === 'Resolved' ? 'resolved' : 'current';
    const openView = result.isResolved ? SOLVED_VIEW : CURRENT_VIEW;
    const openCmd = `viewIssue(${result.lineIndex}, ${result.issueIndex}, '${openView}')`;

    html += `
      <div class="search-item">
        <div class="search-item-header">
          <div class="search-status ${statusClass}">${result.status}</div>
          <div class="search-line-badge">${result.lineName}</div>
        </div>
        <div class="search-item-title">${issue.title || 'No Title'}</div>
        <div class="search-meta">
          <div><b>ESN:</b> ${issue.esn || 'N/A'}</div>
          <div><b>Station:</b> ${issue.station || 'N/A'}</div>
          <div><b>Date Found:</b> ${issue.dateFound || 'N/A'}</div>
          <div><b>How Found:</b> ${issue.foundHow || 'N/A'}</div>
          <div><b>Description:</b> ${(issue.description || 'N/A').substring(0,150)}</div>
        </div>
        <div class="search-item-actions">
          <button onclick="${openCmd}">Open Issue</button>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

document.getElementById('searchInput').addEventListener('keydown', function(e){ if (e.key === 'Enter') runSearch(); });

function getTotalCurrentIssues(){ return lines.reduce((total, line) => total + line.issues.length, 0); }
function getTotalResolvedIssues(){ return lines.reduce((total, line) => total + line.resolvedIssues.length, 0); }
function getTotalVisits(){
  return lines.reduce((total, line) => total + line.issues.reduce((sum, issue) => sum + (issue.visits ? issue.visits.length : 0), 0) + line.resolvedIssues.reduce((sum, issue) => sum + (issue.visits ? issue.visits.length : 0), 0), 0);
}

function toggleFilter(lineName, status){
  if (activeLine === lineName && activeFilter === status) {
    activeLine = null;
    activeFilter = ALL_VIEW;
  } else {
    activeLine = lineName;
    activeFilter = status;
  }
  render();
}

function getFilteredLineIssues(line) {
  if (activeLine && activeLine !== line.name) return [];
  if (activeFilter === CURRENT_VIEW) return line.issues;
  if (activeFilter === SOLVED_VIEW) return line.resolvedIssues;
  return [...line.issues, ...line.resolvedIssues];
}

function render(){
  let board = document.getElementById('board');
  board.innerHTML = '';

  lines.forEach((line, lineIndex) => {
    const filteredIssues = getFilteredLineIssues(line);
    const column = document.createElement('div');
    column.className = 'column';

    const currentButtonClass = activeLine === line.name && activeFilter === CURRENT_VIEW ? 'active' : '';
    const solvedButtonClass = activeLine === line.name && activeFilter === SOLVED_VIEW ? 'active' : '';

    const columnHeader = `
      <div class="column-header ${line.color}">
        <div class="header-title">${line.name}</div>
        <div class="header-badges">
          <button class="badge-btn ${currentButtonClass}" onclick="toggleFilter('${line.name}', '${CURRENT_VIEW}')">Current: ${line.issues.length}</button>
          <button class="badge-btn ${solvedButtonClass}" onclick="toggleFilter('${line.name}', '${SOLVED_VIEW}')">Solved: ${line.resolvedIssues.length}</button>
        </div>
        <button class="column-add-btn" onclick="addIssue(${lineIndex})">+ Issue</button>
      </div>
    `;

    const body = document.createElement('div');
    body.className = 'column-body';

    if (!filteredIssues || filteredIssues.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No items in this view.';
      body.appendChild(empty);
    } else {
      filteredIssues.forEach((issue) => {
        const issueType = line.issues.includes(issue) ? CURRENT_VIEW : SOLVED_VIEW;
        const issueIndex = issueType === CURRENT_VIEW ? line.issues.indexOf(issue) : line.resolvedIssues.indexOf(issue);

        const card = document.createElement('div');
        card.className = 'card';

        let meetingsHtml = '';
        if (issue.visits && issue.visits.length > 0) {
          meetingsHtml = '<div class="meetings">';
          issue.visits.forEach((visit, visitIndex) => {
            meetingsHtml += `
              <div class="meeting-item">
                <div class="meeting-label">Meeting ${visitIndex + 1}</div>
                <div class="meeting-detail"><b>Date:</b> ${visit.date}</div>
                <div class="meeting-detail"><b>People:</b> ${visit.people}</div>
                <div class="meeting-detail"><b>Location:</b> ${visit.location}</div>
                <div class="meeting-detail"><b>Notes:</b> ${visit.notes}</div>
              </div>
            `;
          });
          meetingsHtml += '</div>';
        }

        const isSolvedView = issueType === SOLVED_VIEW;

        card.innerHTML = `
          <div class="card-title">${issue.title}</div>
          <div class="card-info">
            ESN: ${issue.esn}<br>
            Station: ${issue.station}<br>
            Date Found: ${issue.dateFound || 'Not set'}<br>
            Found By: ${issue.foundHow || 'Not set'}
          </div>
          ${meetingsHtml}
          <div class="actions">
            <button class="card-button" onclick="viewIssue(${lineIndex},${issueIndex}, '${issueType}')">Open</button>
            <button class="card-button" onclick="editIssue(${lineIndex},${issueIndex}, '${issueType}')">Edit</button>
            <button class="card-button" onclick="deleteIssue(${lineIndex},${issueIndex}, '${issueType}')">Delete</button>
            <button class="card-button" onclick="addVisit(${lineIndex},${issueIndex}, '${issueType}')">+ Meeting</button>
            <button class="card-button ${isSolvedView ? 'blue' : 'green'}" onclick="${isSolvedView ? `moveIssueToCurrent(${lineIndex},${issueIndex})` : `moveIssueToSolved(${lineIndex},${issueIndex})`}">${isSolvedView ? 'Move to Current' : 'Move to Solved'}</button>
          </div>
        `;

        body.appendChild(card);
      });
    }

    column.innerHTML = columnHeader;
    column.appendChild(body);
    board.appendChild(column);
  });

  document.getElementById('issueCount').innerText = getTotalCurrentIssues();
  document.getElementById('resolvedCount').innerText = getTotalResolvedIssues();
  document.getElementById('visitCount').innerText = getTotalVisits();
  renderSearchResults();
  saveData();
}

function openModal(html){
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modal').style.display = 'block';
}

function closeModal(){
  document.getElementById('modal').style.display = 'none';
}

function addIssue(lineIndex){
  openModal(`
    <h2>New Issue</h2>
    <input id="title" placeholder="Title">
    <input id="esn" placeholder="ESN">
    <input id="station" placeholder="Station">
    <input id="dateFound" type="date">
    <textarea id="foundHow" placeholder="How issue was found"></textarea>
    <textarea id="description" placeholder="Description"></textarea>
    <button onclick="saveNewIssue(${lineIndex})">Save</button>
    <button onclick="closeModal()">Cancel</button>
  `);
}

function saveNewIssue(lineIndex){
  lines[lineIndex].issues.push({
    title:title.value,
    esn:esn.value,
    station:station.value,
    dateFound:dateFound.value,
    foundHow:foundHow.value,
    description:description.value,
    visits:[]
  });
  closeModal();
  render();
}

function editIssue(lineIndex, issueIndex, view){
  let issue = view === SOLVED_VIEW ? lines[lineIndex].resolvedIssues[issueIndex] : lines[lineIndex].issues[issueIndex];
  openModal(`
    <h2>Edit Issue</h2>
    <input id="title" value="${issue.title}">
    <input id="esn" value="${issue.esn}">
    <input id="station" value="${issue.station}">
    <input id="dateFound" type="date" value="${issue.dateFound || ''}">
    <textarea id="foundHow">${issue.foundHow || ''}</textarea>
    <textarea id="description">${issue.description}</textarea>
    <button onclick="updateIssue(${lineIndex},${issueIndex}, '${view}')">Save</button>
  `);
}

function updateIssue(lineIndex, issueIndex, view){
  let issue = view === SOLVED_VIEW ? lines[lineIndex].resolvedIssues[issueIndex] : lines[lineIndex].issues[issueIndex];
  issue.title = title.value;
  issue.esn = esn.value;
  issue.station = station.value;
  issue.dateFound = dateFound.value;
  issue.foundHow = foundHow.value;
  issue.description = description.value;
  closeModal();
  render();
}

function deleteIssue(lineIndex, issueIndex, view){
  if (confirm('Delete issue?')) {
    if (view === SOLVED_VIEW) lines[lineIndex].resolvedIssues.splice(issueIndex, 1);
    else lines[lineIndex].issues.splice(issueIndex, 1);
    render();
  }
}

function addVisit(lineIndex, issueIndex, view){
  openModal(`
    <h2>Add Meeting</h2>
    <input id="date" type="date">
    <input id="people" placeholder="People">
    <input id="location" placeholder="Location">
    <textarea id="notes" placeholder="Notes"></textarea>
    <button onclick="saveVisit(${lineIndex},${issueIndex}, '${view}')">Save</button>
  `);
}

function saveVisit(lineIndex, issueIndex, view){
  let issue = view === SOLVED_VIEW ? lines[lineIndex].resolvedIssues[issueIndex] : lines[lineIndex].issues[issueIndex];
  if (!issue.visits) issue.visits = [];
  issue.visits.push({
    date:date.value,
    people:people.value,
    location:location.value,
    notes:notes.value
  });
  closeModal();
  render();
}

function viewIssue(lineIndex, issueIndex, view){
  let issue = view === SOLVED_VIEW ? lines[lineIndex].resolvedIssues[issueIndex] : lines[lineIndex].issues[issueIndex];
  let html = `
    <h2>${issue.title}</h2>
    <p><b>ESN:</b> ${issue.esn}</p>
    <p><b>Station:</b> ${issue.station}</p>
    <p><b>Date Found:</b> ${issue.dateFound || 'Not set'}</p>
    <p><b>How issue was found:</b> ${issue.foundHow || 'Not set'}</p>
    <p>${issue.description}</p>
    <h3>Meetings</h3>
  `;

  if (issue.visits && issue.visits.length) {
    issue.visits.forEach((visit,index) => {
      html += `
        <div class="visit">
          <b>Meeting ${index + 1}</b><br><br>
          Date: ${visit.date}<br>
          People: ${visit.people}<br>
          Location: ${visit.location}<br>
          Notes: ${visit.notes}<br><br>
          <button onclick="editVisit(${lineIndex}, ${issueIndex}, ${index}, '${view}')">Edit</button>
          <button onclick="deleteVisit(${lineIndex}, ${issueIndex}, ${index}, '${view}')">Delete</button>
        </div>
      `;
    });
  }

  html += '<br><button onclick="closeModal()">Close</button>';
  openModal(html);
}

function moveIssueToSolved(lineIndex, issueIndex){
  const issue = lines[lineIndex].issues.splice(issueIndex, 1)[0];
  if (!issue) return;
  issue.resolvedDate = new Date().toLocaleString();
  lines[lineIndex].resolvedIssues.push(issue);
  render();
}

function moveIssueToCurrent(lineIndex, issueIndex){
  const issue = lines[lineIndex].resolvedIssues.splice(issueIndex, 1)[0];
  if (!issue) return;
  lines[lineIndex].issues.push(issue);
  render();
}

function editVisit(lineIndex, issueIndex, visitIndex, view){
  let issue = view === SOLVED_VIEW ? lines[lineIndex].resolvedIssues[issueIndex] : lines[lineIndex].issues[issueIndex];
  let visit = issue.visits[visitIndex];
  openModal(`
    <h2>Edit Meeting</h2>
    <input id="date" type="date" value="${visit.date}">
    <input id="people" value="${visit.people}">
    <input id="location" value="${visit.location}">
    <textarea id="notes">${visit.notes}</textarea>
    <button onclick="saveVisitEdit(${lineIndex}, ${issueIndex}, ${visitIndex}, '${view}')">Save</button>
  `);
}

function saveVisitEdit(lineIndex, issueIndex, visitIndex, view){
  let issue = view === SOLVED_VIEW ? lines[lineIndex].resolvedIssues[issueIndex] : lines[lineIndex].issues[issueIndex];
  let visit = issue.visits[visitIndex];
  visit.date = date.value;
  visit.people = people.value;
  visit.location = location.value;
  visit.notes = notes.value;
  closeModal();
  render();
}

function deleteVisit(lineIndex, issueIndex, visitIndex, view){
  let issue = view === SOLVED_VIEW ? lines[lineIndex].resolvedIssues[issueIndex] : lines[lineIndex].issues[issueIndex];
  issue.visits.splice(visitIndex, 1);
  render();
}

render();
</script>

</body>
</html>
