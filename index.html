<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>EPS Command Board</title>

<style>
:root{
 --red:#DA291C;
 --orange:#F58220;
 --yellow:#FFD100;
 --green:#4CAF50;
}

body{
 margin:0;
 font-family:Segoe UI,sans-serif;
 background:#fff;
 color:#222;
}

.header{
 padding:20px;
 border-bottom:1px solid #ddd;
}

.header-top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:20px;
 flex-wrap:wrap;
}

.view-toggle{
 display:flex;
 gap:10px;
}

.view-toggle button{
 padding:10px 16px;
 font-weight:bold;
}

.view-toggle .active{
 background:#222;
 color:white;
}

.stats{
 display:flex;
 gap:15px;
 margin-top:10px;
 flex-wrap:wrap;
}

.stat{
 background:#f5f5f5;
 padding:10px 18px;
 border-radius:8px;
 border:1px solid #ddd;
}

.board{
 display:flex;
 gap:15px;
 padding:15px;
 overflow-x:auto;
 align-items:flex-start;
}

.column{
 min-width:350px;
 border:1px solid #ddd;
 border-radius:10px;
 background:#fafafa;
}

.column-header{
 padding:12px;
 color:white;
 font-weight:bold;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}

.header-title{
 flex:1;
}

.header-badges{
 display:flex;
 gap:8px;
 font-size:12px;
}

.badge{
 background:rgba(255,255,255,0.3);
 padding:4px 8px;
 border-radius:4px;
 white-space:nowrap;
}

.red{background:var(--red);}
.orange{background:var(--orange);}
.yellow{
 background:var(--yellow);
 color:black;
}
.green{background:var(--green);}

.card{
 background:white;
 margin:10px;
 border:1px solid #ddd;
 border-radius:8px;
 padding:10px;
}

.card-title{
 font-weight:bold;
 margin-bottom:8px;
}

.card-info{
 font-size:14px;
 margin-bottom:8px;
 color:#555;
}

.meetings{
 margin-top:10px;
 border-top:1px solid #eee;
 padding-top:8px;
}

.meeting-item{
 background:#f9f9f9;
 padding:8px;
 margin:5px 0;
 border-radius:4px;
 font-size:12px;
 border-left:3px solid var(--orange);
}

.meeting-label{
 font-weight:bold;
 color:#333;
}

.meeting-detail{
 color:#666;
 margin-top:3px;
}

.actions{
 display:flex;
 gap:5px;
 flex-wrap:wrap;
 margin-top:10px;
}

button{
 cursor:pointer;
 border:none;
 padding:8px 12px;
 border-radius:6px;
 background:#ececec;
 font-size:12px;
}

button:hover{
 background:#ddd;
}

.resolve-btn{
 background:#4CAF50;
 color:white;
}

.resolve-btn:hover{
 background:#45a049;
}

.current-btn{
 background:#2d6cdf;
 color:white;
}

.current-btn:hover{
 background:#2458b5;
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.7);
 overflow:auto;
 z-index:1000;
}

.modal-content{
 max-width:900px;
 margin:40px auto;
 background:white;
 padding:20px;
 border-radius:8px;
}

input,textarea{
 width:100%;
 padding:8px;
 margin-bottom:10px;
 box-sizing:border-box;
}

.visit{
 margin-top:10px;
 background:#f7f7f7;
 padding:10px;
 border-left:4px solid var(--red);
}
</style>
</head>
<body>

<div class="header">

<div class="header-top">
  <h1>EPS COMMAND BOARD</h1>

  <div class="view-toggle">
    <button id="currentViewButton" class="active" onclick="setView('current')">Current</button>
    <button id="solvedViewButton" onclick="setView('solved')">Solved</button>
  </div>
</div>

<div class="stats">

<div class="stat">
Current Issues:
<span id="issueCount">0</span>
</div>

<div class="stat">
Issues Resolved:
<span id="resolvedCount">0</span>
</div>

<div class="stat">
Visits This Week:
<span id="visitCount">0</span>
</div>

</div>

</div>

<div id="board" class="board"></div>

<div id="modal" class="modal">
<div class="modal-content">
<div id="modalContent"></div>
</div>
</div>

<script>

const CURRENT_VIEW = "current";
const SOLVED_VIEW = "solved";
let currentView = localStorage.getItem("epsCurrentView") || CURRENT_VIEW;

let lines = JSON.parse(
 localStorage.getItem("epsLines")
) || [

{
 name:"19L",
 color:"red",
 issues:[],
 resolvedIssues:[]
},

{
 name:"30L",
 color:"orange",
 issues:[],
 resolvedIssues:[]
},

{
 name:"95L",
 color:"yellow",
 issues:[],
 resolvedIssues:[]
},

{
 name:"15L",
 color:"green",
 issues:[],
 resolvedIssues:[]
}

];

function normalizeLines() {
 lines = lines.map(line => ({
   name: line.name,
   color: line.color,
   issues: Array.isArray(line.issues) ? line.issues : [],
   resolvedIssues: Array.isArray(line.resolvedIssues) ? line.resolvedIssues : []
 }));
}

normalizeLines();

const legacyResolved = JSON.parse(localStorage.getItem("epsResolvedIssues") || "[]");
if (legacyResolved.length && lines.some(line => line.resolvedIssues.length === 0)) {
  legacyResolved.forEach(issue => {
    const targetLine = lines.find(line => line.name === issue.line);
    if (targetLine && !targetLine.resolvedIssues.some(item => item.title === issue.title && item.esn === issue.esn && item.station === issue.station)) {
      targetLine.resolvedIssues.push({
        ...issue,
        visits: Array.isArray(issue.visits) ? issue.visits : []
      });
    }
  });
  localStorage.setItem("epsResolvedIssues", JSON.stringify([]));
}

function saveData(){
  localStorage.setItem("epsLines", JSON.stringify(lines));
  localStorage.setItem("epsCurrentView", currentView);

  const flattenedResolved = lines.flatMap(line => line.resolvedIssues.map(issue => ({
    ...issue,
    line: line.name
  })));
  localStorage.setItem("epsResolvedIssues", JSON.stringify(flattenedResolved));
}

function getTotalCurrentIssues(){
  return lines.reduce((total, line) => total + line.issues.length, 0);
}

function getTotalResolvedIssues(){
  return lines.reduce((total, line) => total + line.resolvedIssues.length, 0);
}

function getTotalVisits(){
  return lines.reduce((total, line) => {
    return total + line.issues.reduce((sum, issue) => sum + issue.visits.length, 0) + line.resolvedIssues.reduce((sum, issue) => sum + issue.visits.length, 0);
  }, 0);
}

function setView(view){
  currentView = view;
  render();
}

function render(){

 lines.sort((a,b) => {
   const aCount = currentView === CURRENT_VIEW ? b.issues.length : b.resolvedIssues.length;
   const bCount = currentView === CURRENT_VIEW ? a.issues.length : a.resolvedIssues.length;
   return aCount - bCount;
 });

 let board=document.getElementById("board");
 board.innerHTML="";

 document.getElementById("currentViewButton").classList.toggle("active", currentView === CURRENT_VIEW);
 document.getElementById("solvedViewButton").classList.toggle("active", currentView === SOLVED_VIEW);

 lines.forEach((line,lineIndex)=>{

   let visibleIssues = currentView === CURRENT_VIEW ? line.issues : line.resolvedIssues;

   let column=document.createElement("div");
   column.className="column";

   column.innerHTML=
   `
   <div class="column-header ${line.color}">
      <div class="header-title">
        ${line.name} (${visibleIssues.length})
      </div>
      <div class="header-badges">
        <div class="badge">Current: ${line.issues.length}</div>
        <div class="badge">Solved: ${line.resolvedIssues.length}</div>
      </div>
      <button onclick="addIssue(${lineIndex})">
      + Issue
      </button>
   </div>
   `;

   visibleIssues.forEach((issue,issueIndex)=>{

      let card=document.createElement("div");
      card.className="card";

      let meetingsHtml = '';
      if(issue.visits && issue.visits.length > 0){
        meetingsHtml = '<div class="meetings">';
        issue.visits.forEach((visit, visitIndex) => {
          meetingsHtml += `
          <div class="meeting-item">
            <div class="meeting-label">Meeting ${visitIndex + 1}</div>
            <div class="meeting-detail"><b>Date:</b> ${visit.date}</div>
            <div class="meeting-detail"><b>People:</b> ${visit.people}</div>
            <div class="meeting-detail"><b>Location:</b> ${visit.location}</div>
            <div class="meeting-detail"><b>Notes:</b> ${visit.notes}</div>
          </div>
          `;
        });
        meetingsHtml += '</div>';
      }

      const isSolvedView = currentView === SOLVED_VIEW;

      card.innerHTML=
      `
      <div class="card-title">${issue.title}</div>
      <div class="card-info">
        ESN: ${issue.esn}<br>
        Station: ${issue.station}<br>
        Date Found: ${issue.dateFound || 'Not set'}<br>
        Found By: ${issue.foundHow || 'Not set'}
      </div>

      ${meetingsHtml}

      <div class="actions">

        <button onclick="viewIssue(${lineIndex},${issueIndex}, '${currentView}')">
        Open
        </button>

        <button onclick="editIssue(${lineIndex},${issueIndex}, '${currentView}')">
        Edit
        </button>

        <button onclick="deleteIssue(${lineIndex},${issueIndex}, '${currentView}')">
        Delete
        </button>

        <button onclick="addVisit(${lineIndex},${issueIndex}, '${currentView}')">
        + Meeting
        </button>

        <button class="${isSolvedView ? 'current-btn' : 'resolve-btn'}" onclick="${isSolvedView ? `moveIssueToCurrent(${lineIndex},${issueIndex})` : `moveIssueToSolved(${lineIndex},${issueIndex})`}">
        ${isSolvedView ? 'Move to Current' : 'Move to Solved'}
        </button>

      </div>
      `;

      column.appendChild(card);

   });

   board.appendChild(column);

 });

 document.getElementById("issueCount").innerText=getTotalCurrentIssues();
 document.getElementById("resolvedCount").innerText=getTotalResolvedIssues();
 document.getElementById("visitCount").innerText=getTotalVisits();

 saveData();
}

function openModal(html){
 document.getElementById("modalContent").innerHTML=html;
 document.getElementById("modal").style.display="block";
}

function closeModal(){
 document.getElementById("modal").style.display="none";
}

function addIssue(lineIndex){

 openModal(`
 <h2>New Issue</h2>

 <input id="title" placeholder="Title">
 <input id="esn" placeholder="ESN">
 <input id="station" placeholder="Station">
 <input id="dateFound" type="date" placeholder="Date Found">
 <textarea id="foundHow" placeholder="How issue was found"></textarea>
 <textarea id="description" placeholder="Description"></textarea>

 <button onclick="saveNewIssue(${lineIndex})">
 Save
 </button>

 <button onclick="closeModal()">
 Cancel
 </button>
 `);

}

function saveNewIssue(lineIndex){

 lines[lineIndex].issues.push({
   title:title.value,
   esn:esn.value,
   station:station.value,
   dateFound:dateFound.value,
   foundHow:foundHow.value,
   description:description.value,
   visits:[]
 });

 closeModal();
 render();
}

function editIssue(lineIndex,issueIndex, view){

 let issue = view === SOLVED_VIEW ? lines[lineIndex].resolvedIssues[issueIndex] : lines[lineIndex].issues[issueIndex];

 openModal(`
 <h2>Edit Issue</h2>

 <input id="title" value="${issue.title}">
 <input id="esn" value="${issue.esn}">
 <input id="station" value="${issue.station}">
 <input id="dateFound" type="date" value="${issue.dateFound || ''}">
 <textarea id="foundHow">${issue.foundHow || ''}</textarea>
 <textarea id="description">${issue.description}</textarea>

 <button onclick="
 updateIssue(${lineIndex},${issueIndex}, '${view}')
 ">
 Save
 </button>
 `);

}

function updateIssue(lineIndex,issueIndex, view){

 let issue = view === SOLVED_VIEW ? lines[lineIndex].resolvedIssues[issueIndex] : lines[lineIndex].issues[issueIndex];

 issue.title=title.value;
 issue.esn=esn.value;
 issue.station=station.value;
 issue.dateFound=dateFound.value;
 issue.foundHow=foundHow.value;
 issue.description=description.value;

 closeModal();
 render();
}

function deleteIssue(lineIndex,issueIndex, view){

 if(confirm("Delete issue?")){

   if (view === SOLVED_VIEW) {
     lines[lineIndex].resolvedIssues.splice(issueIndex,1);
   } else {
     lines[lineIndex].issues.splice(issueIndex,1);
   }

   render();
 }
}

function addVisit(lineIndex,issueIndex, view){

 openModal(`
 <h2>Add Meeting</h2>

 <input id="date" type="date" placeholder="Date">
 <input id="people" placeholder="People">
 <input id="location" placeholder="Location">
 <textarea id="notes" placeholder="Notes"></textarea>

 <button onclick="
 saveVisit(${lineIndex},${issueIndex}, '${view}')
 ">
 Save
 </button>
 `);

}

function saveVisit(lineIndex,issueIndex, view){

 let issue = view === SOLVED_VIEW ? lines[lineIndex].resolvedIssues[issueIndex] : lines[lineIndex].issues[issueIndex];

 if (!issue.visits) issue.visits = [];

 issue.visits.push({
   date:date.value,
   people:people.value,
   location:location.value,
   notes:notes.value
 });

 closeModal();
 render();
}

function viewIssue(lineIndex,issueIndex, view){

 let issue = view === SOLVED_VIEW ? lines[lineIndex].resolvedIssues[issueIndex] : lines[lineIndex].issues[issueIndex];

 let html=`
 <h2>${issue.title}</h2>

 <p><b>ESN:</b> ${issue.esn}</p>
 <p><b>Station:</b> ${issue.station}</p>
 <p><b>Date Found:</b> ${issue.dateFound || 'Not set'}</p>
 <p><b>How issue was found:</b> ${issue.foundHow || 'Not set'}</p>
 <p>${issue.description}</p>

 <h3>Meetings</h3>
 `;

 if (issue.visits && issue.visits.length) {
   issue.visits.forEach((visit,index)=>{

   html += `
   <div class="visit">

   <b>Meeting ${index+1}</b><br><br>

   Date: ${visit.date}<br>
   People: ${visit.people}<br>
   Location: ${visit.location}<br>
   Notes: ${visit.notes}

   <br><br>

   <button onclick="
   editVisit(${lineIndex},
             ${issueIndex},
             ${index}, '${view}')">
   Edit
   </button>

   <button onclick="
   deleteVisit(${lineIndex},
               ${issueIndex},
               ${index}, '${view}')">
   Delete
   </button>

   </div>
   `;
   });
 }

 html += `
 <br>
 <button onclick="closeModal()">
 Close
 </button>
 `;

 openModal(html);
}

function moveIssueToSolved(lineIndex, issueIndex){
  const issue = lines[lineIndex].issues.splice(issueIndex, 1)[0];
  if (!issue) return;
  issue.resolvedDate = new Date().toLocaleString();
  lines[lineIndex].resolvedIssues.push(issue);
  render();
}

function moveIssueToCurrent(lineIndex, issueIndex){
  const issue = lines[lineIndex].resolvedIssues.splice(issueIndex, 1)[0];
  if (!issue) return;
  lines[lineIndex].issues.push(issue);
  render();
}

function editVisit(lineIndex,issueIndex,visitIndex, view){

 let issue = view === SOLVED_VIEW ? lines[lineIndex].resolvedIssues[issueIndex] : lines[lineIndex].issues[issueIndex];
 let visit = issue.visits[visitIndex];

 openModal(`

 <h2>Edit Meeting</h2>

 <input id="date" type="date" value="${visit.date}">
 <input id="people" value="${visit.people}">
 <input id="location" value="${visit.location}">
 <textarea id="notes">${visit.notes}</textarea>

 <button onclick="
 saveVisitEdit(
 ${lineIndex},
 ${issueIndex},
 ${visitIndex},
 '${view}'
 )">
 Save
 </button>

 `);

}

function saveVisitEdit(
 lineIndex,
 issueIndex,
 visitIndex,
 view
){

 let issue = view === SOLVED_VIEW ? lines[lineIndex].resolvedIssues[issueIndex] : lines[lineIndex].issues[issueIndex];
 let visit = issue.visits[visitIndex];

 visit.date=date.value;
 visit.people=people.value;
 visit.location=location.value;
 visit.notes=notes.value;

 closeModal();
 render();
}

function deleteVisit(
 lineIndex,
 issueIndex,
 visitIndex,
 view
){

 let issue = view === SOLVED_VIEW ? lines[lineIndex].resolvedIssues[issueIndex] : lines[lineIndex].issues[issueIndex];
 issue.visits.splice(visitIndex,1);

 render();
}

render();

</script>

</body>
</html>
