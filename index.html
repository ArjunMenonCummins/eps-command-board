<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EPS Command Board</title>
  <style>
    :root{
      --red:#DA291C;
      --orange:#F58220;
      --yellow:#FFD100;
      --green:#4CAF50;
      --blue:#0d6efd;
      --dark:#222;
      --bg:#f4f4f4;
      --panel:#ffffff;
      --line:#d9d9d9;
      --muted:#666;
      --shadow:0 4px 14px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; }

    body{
      margin:0;
      font-family: Segoe UI, Arial, sans-serif;
      background:#fff;
      color:#222;
    }

    .header{
      padding:20px 22px 16px;
      border-bottom:1px solid #ddd;
      background:#fff;
    }

    .header-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:18px;
      flex-wrap:wrap;
    }

    h1{
      margin:0;
      font-size:2rem;
      letter-spacing:0.06em;
    }

    .view-toggle{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .view-toggle button,
    .search-actions button,
    .primary-btn,
    .secondary-btn,
    .danger-btn,
    .mini-btn{
      border:none;
      border-radius:8px;
      padding:10px 14px;
      font-weight:700;
      cursor:pointer;
      transition:0.2s ease;
    }

    .view-toggle button{
      background:#ececec;
      color:#222;
    }

    .view-toggle button.active{
      background:#222;
      color:white;
    }

    .view-toggle button:hover,
    .search-actions button:hover,
    .primary-btn:hover,
    .secondary-btn:hover,
    .danger-btn:hover,
    .mini-btn:hover{
      filter:brightness(0.97);
    }

    .stats{
      display:flex;
      gap:15px;
      margin-top:16px;
      flex-wrap:wrap;
    }

    .stat{
      background:#f5f5f5;
      border:1px solid #ddd;
      border-radius:10px;
      padding:10px 16px;
      min-width:160px;
      font-weight:600;
    }

    .stat small{
      display:block;
      color:#555;
      margin-top:4px;
      font-size:12px;
      font-weight:500;
    }

    .search-wrap{
      margin-top:18px;
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .search-box{
      flex:1;
      min-width:260px;
      padding:14px 16px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:15px;
    }

    .search-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .search-panel{
      margin-top:20px;
      border:1px solid #ddd;
      background:#f8f8f8;
      border-radius:12px;
      padding:16px;
      display:none;
    }

    .search-panel.visible{
      display:block;
    }

    .search-panel h3{
      margin:0 0 12px;
      font-size:1.1rem;
    }

    .search-results{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .search-item{
      background:white;
      border:1px solid #ddd;
      border-radius:10px;
      padding:12px;
      box-shadow:var(--shadow);
    }

    .search-item-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:8px;
      flex-wrap:wrap;
    }

    .search-status{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      letter-spacing:0.02em;
    }

    .search-status.current{
      background:#dfeeff;
      color:#0c4ca3;
    }

    .search-status.resolved{
      background:#dff7e8;
      color:#1d6e3b;
    }

    .search-item-title{
      font-size:17px;
      font-weight:700;
      margin-bottom:8px;
    }

    .search-meta{
      color:#555;
      font-size:13px;
      line-height:1.7;
    }

    .search-empty{
      background:white;
      border:1px dashed #ccc;
      border-radius:10px;
      color:#666;
      padding:16px;
    }

    .board{
      display:flex;
      gap:15px;
      padding:15px;
      overflow-x:auto;
      align-items:flex-start;
    }

    .column{
      min-width:350px;
      border:1px solid #ddd;
      border-radius:12px;
      background:#fafafa;
      box-shadow:var(--shadow);
    }

    .column-header{
      padding:12px;
      color:#fff;
      font-weight:700;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      border-top-left-radius:12px;
      border-top-right-radius:12px;
    }

    .header-title{
      flex:1;
      white-space:nowrap;
    }

    .header-badges{
      display:flex;
      gap:8px;
      align-items:center;
      font-size:12px;
      flex-wrap:wrap;
    }

    .badge{
      background:rgba(255,255,255,0.25);
      color:#fff;
      padding:4px 8px;
      border-radius:999px;
      white-space:nowrap;
      font-weight:700;
    }

    .red{ background:var(--red); }
    .orange{ background:var(--orange); }
    .yellow{ background:var(--yellow); color:#111; }
    .green{ background:var(--green); }

    .column-body{
      padding:10px;
    }

    .card{
      background:white;
      border:1px solid #ddd;
      border-radius:10px;
      padding:12px;
      margin-bottom:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.04);
    }

    .issue-top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      margin-bottom:8px;
    }

    .issue-title{
      font-weight:700;
      font-size:15px;
      line-height:1.4;
      flex:1;
    }

    .status-pill{
      font-size:11px;
      font-weight:700;
      border-radius:999px;
      padding:5px 9px;
      white-space:nowrap;
    }

    .status-pill.current{
      background:#dfeeff;
      color:#0c4ca3;
    }

    .status-pill.resolved{
      background:#dff7e8;
      color:#1d6e3b;
    }

    .meta{
      color:#444;
      font-size:13px;
      line-height:1.7;
    }

    .actions{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      margin-top:12px;
    }

    .mini-btn{
      background:#ececec;
      color:#222;
      padding:7px 10px;
      font-size:12px;
    }

    .primary-btn{
      background:#222;
      color:#fff;
    }

    .secondary-btn{
      background:#efefef;
      color:#222;
    }

    .danger-btn{
      background:#f7d7d7;
      color:#8f1d1d;
    }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.7);
      overflow:auto;
      z-index:1000;
      padding:24px;
    }

    .modal-content{
      max-width:900px;
      margin:40px auto;
      background:#fff;
      border-radius:12px;
      padding:22px;
      box-shadow:0 15px 40px rgba(0,0,0,0.2);
    }

    .modal h2, .modal h3{
      margin-top:0;
    }

    .form-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
    }

    .full{
      grid-column:1 / -1;
    }

    label{
      display:block;
      font-weight:600;
      margin:8px 0 6px;
      color:#333;
    }

    input, textarea, select{
      width:100%;
      padding:10px 12px;
      border:1px solid #ccc;
      border-radius:8px;
      font:inherit;
      background:#fff;
      color:#111;
    }

    textarea{
      min-height:100px;
      resize:vertical;
    }

    .button-row{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:14px;
    }

    .visit{
      background:#f8f8f8;
      border:1px solid #ddd;
      border-radius:10px;
      padding:12px;
      margin-top:12px;
    }

    .visit-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:12px;
      flex-wrap:wrap;
    }

    .visit-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:10px;
    }

    @media (max-width: 800px){
      .form-grid{
        grid-template-columns:1fr;
      }

      .column{
        min-width:280px;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-top">
      <h1>EPS COMMAND BOARD</h1>

      <div class="view-toggle">
        <button class="view-btn active" data-view="board">Board View</button>
        <button class="view-btn" data-view="search">Search View</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        Open Issues
        <small id="issueCount">0</small>
      </div>

      <div class="stat">
        Meetings Logged
        <small id="visitCount">0</small>
      </div>

      <div class="stat">
        Current Issues
        <small id="currentCount">0</small>
      </div>

      <div class="stat">
        Resolved Issues
        <small id="resolvedCount">0</small>
      </div>
    </div>

    <div class="search-wrap">
      <input id="globalSearch" class="search-box" type="text" placeholder="Search issue titles, ESN, station, description, or meeting notes..." />
      <div class="search-actions">
        <button class="secondary-btn" onclick="clearSearch()">Clear</button>
      </div>
    </div>

    <div id="searchPanel" class="search-panel">
      <h3>Search Results</h3>
      <div id="searchResults" class="search-results"></div>
    </div>
  </div>

  <div id="board" class="board"></div>

  <div id="modal" class="modal">
    <div id="modalContent" class="modal-content"></div>
  </div>

  <script>
    const STORAGE_KEY = "epsLinesV2";

    const defaultLines = [
      { name: "19L", color: "red", issues: [] },
      { name: "30L", color: "orange", issues: [] },
      { name: "95L", color: "yellow", issues: [] },
      { name: "15L", color: "green", issues: [] }
    ];

    let state = {
      view: "board",
      lines: [],
      searchQuery: ""
    };

    function loadData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        state.lines = JSON.parse(JSON.stringify(defaultLines));
        return;
      }

      try {
        const data = JSON.parse(raw);
        if (!Array.isArray(data) || data.length === 0) {
          state.lines = JSON.parse(JSON.stringify(defaultLines));
          return;
        }

        state.lines = data.map(line => ({
          name: line.name || "Unknown",
          color: line.color || "red",
          issues: Array.isArray(line.issues) ? line.issues.map(issue => ({
            title: issue.title || "Untitled",
            esn: issue.esn || "",
            station: issue.station || "",
            description: issue.description || "",
            status: ["current", "resolved"].includes(issue.status) ? issue.status : "current",
            visits: Array.isArray(issue.visits) ? issue.visits.map(visit => ({
              date: visit.date || "",
              people: visit.people || "",
              location: visit.location || "",
              notes: visit.notes || ""
            })) : []
          })) : []
        }));
      } catch (error) {
        state.lines = JSON.parse(JSON.stringify(defaultLines));
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.lines));
    }

    function sortLines() {
      state.lines.sort((a, b) => {
        if (b.issues.length !== a.issues.length) return b.issues.length - a.issues.length;
        return a.name.localeCompare(b.name);
      });
    }

    function renderStats() {
      let issueTotal = 0;
      let visitTotal = 0;
      let currentTotal = 0;
      let resolvedTotal = 0;

      state.lines.forEach(line => {
        line.issues.forEach(issue => {
          issueTotal++;
          visitTotal += issue.visits.length;
          if (issue.status === "current") currentTotal++;
          if (issue.status === "resolved") resolvedTotal++;
        });
      });

      document.getElementById("issueCount").textContent = issueTotal;
      document.getElementById("visitCount").textContent = visitTotal;
      document.getElementById("currentCount").textContent = currentTotal;
      document.getElementById("resolvedCount").textContent = resolvedTotal;
    }

    function getFilteredIssues() {
      const q = (state.searchQuery || "").trim().toLowerCase();
      const results = [];

      state.lines.forEach((line, lineIndex) => {
        line.issues.forEach((issue, issueIndex) => {
          const haystack = [
            line.name,
            issue.title,
            issue.esn,
            issue.station,
            issue.description,
            issue.status,
            ...(issue.visits || []).map(v => [
              v.date, v.people, v.location, v.notes
            ].join(" "))
          ].join(" ").toLowerCase();

          if (!q || haystack.includes(q)) {
            results.push({ lineIndex, issueIndex, line, issue });
          }
        });
      });

      return results;
    }

    function renderSearchResults() {
      const panel = document.getElementById("searchPanel");
      const resultsWrap = document.getElementById("searchResults");
      const q = (state.searchQuery || "").trim();

      if (state.view !== "search") {
        panel.classList.remove("visible");
        return;
      }

      const matches = getFilteredIssues();

      if (!q) {
        resultsWrap.innerHTML = `<div class="search-empty">Type a keyword above to search across the board.</div>`;
        panel.classList.add("visible");
        return;
      }

      if (!matches.length) {
        resultsWrap.innerHTML = `<div class="search-empty">No issues match your search.</div>`;
        panel.classList.add("visible");
        return;
      }

      resultsWrap.innerHTML = matches.map(({ lineIndex, issueIndex, line, issue }) => {
        const statusClass = issue.status === "resolved" ? "resolved" : "current";
        const statusText = issue.status === "resolved" ? "Resolved" : "Current";

        return `
          <div class="search-item">
            <div class="search-item-header">
              <div class="search-item-title">${escapeHtml(issue.title)}</div>
              <span class="search-status ${statusClass}">${statusText}</span>
            </div>

            <div class="search-meta">
              <div><strong>Line:</strong> ${escapeHtml(line.name)}</div>
              <div><strong>ESN:</strong> ${escapeHtml(issue.esn || "—")}</div>
              <div><strong>Station:</strong> ${escapeHtml(issue.station || "—")}</div>
              <div><strong>Meetings:</strong> ${issue.visits.length}</div>
              <div><strong>Description:</strong> ${escapeHtml(issue.description || "No description provided.")}</div>
            </div>

            <div class="search-item-actions">
              <button class="mini-btn" onclick="viewIssue(${lineIndex}, ${issueIndex})">Open</button>
              <button class="mini-btn" onclick="editIssue(${lineIndex}, ${issueIndex})">Edit</button>
            </div>
          </div>
        `;
      }).join("");

      panel.classList.add("visible");
    }

    function renderBoard() {
      const board = document.getElementById("board");
      board.innerHTML = "";

      sortLines();

      state.lines.forEach((line, lineIndex) => {
        const column = document.createElement("div");
        column.className = "column";

        const currentIssues = line.issues.filter(issue => issue.status === "current").length;
        const resolvedIssues = line.issues.filter(issue => issue.status === "resolved").length;

        column.innerHTML = `
          <div class="column-header ${line.color}">
            <div class="header-title">${line.name}</div>
            <div class="header-badges">
              <span class="badge">${line.issues.length}</span>
              <span class="badge">${currentIssues} current</span>
              <span class="badge">${resolvedIssues} resolved</span>
            </div>
          </div>

          <div class="column-body">
            <button class="primary-btn" style="width:100%; margin-bottom:10px;" onclick="addIssue(${lineIndex})">+ Issue</button>
            ${line.issues.length === 0 ? `
              <div class="search-empty" style="margin-top:10px;">No issues on this line.</div>
            ` : ""}
          </div>
        `;

        line.issues.forEach((issue, issueIndex) => {
          const card = document.createElement("div");
          card.className = "card";

          card.innerHTML = `
            <div class="issue-top">
              <div class="issue-title">${escapeHtml(issue.title)}</div>
              <span class="status-pill ${issue.status === "resolved" ? "resolved" : "current"}">${issue.status === "resolved" ? "Resolved" : "Current"}</span>
            </div>

            <div class="meta">
              <div><strong>ESN:</strong> ${escapeHtml(issue.esn || "—")}</div>
              <div><strong>Station:</strong> ${escapeHtml(issue.station || "—")}</div>
              <div><strong>Meetings:</strong> ${issue.visits.length}</div>
            </div>

            <div class="actions">
              <button class="mini-btn" onclick="viewIssue(${lineIndex}, ${issueIndex})">Open</button>
              <button class="mini-btn" onclick="editIssue(${lineIndex}, ${issueIndex})">Edit</button>
              <button class="mini-btn" onclick="toggleIssueStatus(${lineIndex}, ${issueIndex})">${issue.status === "resolved" ? "Reopen" : "Resolve"}</button>
              <button class="mini-btn" onclick="deleteIssue(${lineIndex}, ${issueIndex})">Delete</button>
              <button class="mini-btn" onclick="addVisit(${lineIndex}, ${issueIndex})">+ Meeting</button>
            </div>
          `;

          column.appendChild(card);
        });

        board.appendChild(column);
      });
    }

    function render() {
      renderBoard();
      renderStats();
      renderSearchResults();
      saveData();
    }

    function setView(mode) {
      state.view = mode;

      document.querySelectorAll(".view-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.view === mode);
      });

      if (mode === "board") {
        const panel = document.getElementById("searchPanel");
        panel.classList.remove("visible");
      } else {
        renderSearchResults();
      }
    }

    function openModal(html) {
      const modal = document.getElementById("modal");
      const modalContent = document.getElementById("modalContent");
      modalContent.innerHTML = html;
      modal.style.display = "block";
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    function escapeHtml(value) {
      const unsafe = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      };
      return String(value ?? "").replace(/[&<>\"']/g, ch => unsafe[ch]);
    }

    function addIssue(lineIndex) {
      openModal(`
        <h2>New Issue</h2>

        <div class="form-grid">
          <div>
            <label for="issueTitle">Title</label>
            <input id="issueTitle" type="text" placeholder="Title" />
          </div>

          <div>
            <label for="issueStatus">Status</label>
            <select id="issueStatus">
              <option value="current">Current</option>
              <option value="resolved">Resolved</option>
            </select>
          </div>

          <div>
            <label for="issueEsn">ESN</label>
            <input id="issueEsn" type="text" placeholder="ESN" />
          </div>

          <div>
            <label for="issueStation">Station</label>
            <input id="issueStation" type="text" placeholder="Station" />
          </div>

          <div class="full">
            <label for="issueDescription">Description</label>
            <textarea id="issueDescription" placeholder="Description"></textarea>
          </div>
        </div>

        <div class="button-row">
          <button class="primary-btn" onclick="saveNewIssue(${lineIndex})">Save</button>
          <button class="secondary-btn" onclick="closeModal()">Cancel</button>
        </div>
      `);
    }

    function saveNewIssue(lineIndex) {
      const title = document.getElementById("issueTitle").value.trim();
      const esn = document.getElementById("issueEsn").value.trim();
      const station = document.getElementById("issueStation").value.trim();
      const description = document.getElementById("issueDescription").value.trim();
      const status = document.getElementById("issueStatus").value;

      if (!title) {
        alert("Issue title is required.");
        return;
      }

      state.lines[lineIndex].issues.push({
        title,
        esn,
        station,
        description,
        status,
        visits: []
      });

      closeModal();
      render();
    }

    function editIssue(lineIndex, issueIndex) {
      const issue = state.lines[lineIndex].issues[issueIndex];

      openModal(`
        <h2>Edit Issue</h2>

        <div class="form-grid">
          <div>
            <label for="issueTitle">Title</label>
            <input id="issueTitle" type="text" value="${escapeHtml(issue.title)}" />
          </div>

          <div>
            <label for="issueStatus">Status</label>
            <select id="issueStatus">
              <option value="current" ${issue.status === "current" ? "selected" : ""}>Current</option>
              <option value="resolved" ${issue.status === "resolved" ? "selected" : ""}>Resolved</option>
            </select>
          </div>

          <div>
            <label for="issueEsn">ESN</label>
            <input id="issueEsn" type="text" value="${escapeHtml(issue.esn)}" />
          </div>

          <div>
            <label for="issueStation">Station</label>
            <input id="issueStation" type="text" value="${escapeHtml(issue.station)}" />
          </div>

          <div class="full">
            <label for="issueDescription">Description</label>
            <textarea id="issueDescription">${escapeHtml(issue.description)}</textarea>
          </div>
        </div>

        <div class="button-row">
          <button class="primary-btn" onclick="updateIssue(${lineIndex}, ${issueIndex})">Save</button>
          <button class="secondary-btn" onclick="closeModal()">Cancel</button>
        </div>
      `);
    }

    function updateIssue(lineIndex, issueIndex) {
      const issue = state.lines[lineIndex].issues[issueIndex];
      issue.title = document.getElementById("issueTitle").value.trim();
      issue.esn = document.getElementById("issueEsn").value.trim();
      issue.station = document.getElementById("issueStation").value.trim();
      issue.description = document.getElementById("issueDescription").value.trim();
      issue.status = document.getElementById("issueStatus").value;

      if (!issue.title) {
        alert("Issue title is required.");
        return;
      }

      closeModal();
      render();
    }

    function toggleIssueStatus(lineIndex, issueIndex) {
      const issue = state.lines[lineIndex].issues[issueIndex];
      issue.status = issue.status === "resolved" ? "current" : "resolved";
      render();
    }

    function deleteIssue(lineIndex, issueIndex) {
      if (!confirm("Delete this issue?")) return;

      state.lines[lineIndex].issues.splice(issueIndex, 1);
      render();
    }

    function addVisit(lineIndex, issueIndex) {
      openModal(`
        <h2>Add Meeting</h2>

        <div class="form-grid">
          <div>
            <label for="visitDate">Date</label>
            <input id="visitDate" type="text" placeholder="Date" />
          </div>

          <div>
            <label for="visitPeople">People</label>
            <input id="visitPeople" type="text" placeholder="People" />
          </div>

          <div>
            <label for="visitLocation">Location</label>
            <input id="visitLocation" type="text" placeholder="Location" />
          </div>

          <div>
            <label for="visitType">Type</label>
            <input id="visitType" type="text" placeholder="Example: Team Review" />
          </div>

          <div class="full">
            <label for="visitNotes">Notes</label>
            <textarea id="visitNotes" placeholder="Notes"></textarea>
          </div>
        </div>

        <div class="button-row">
          <button class="primary-btn" onclick="saveVisit(${lineIndex}, ${issueIndex})">Save</button>
          <button class="secondary-btn" onclick="closeModal()">Cancel</button>
        </div>
      `);
    }

    function saveVisit(lineIndex, issueIndex) {
      const date = document.getElementById("visitDate").value.trim();
      const people = document.getElementById("visitPeople").value.trim();
      const location = document.getElementById("visitLocation").value.trim();
      const type = document.getElementById("visitType").value.trim();
      const notes = document.getElementById("visitNotes").value.trim();

      state.lines[lineIndex].issues[issueIndex].visits.push({
        date,
        people,
        location,
        type,
        notes
      });

      closeModal();
      render();
    }

    function viewIssue(lineIndex, issueIndex) {
      const issue = state.lines[lineIndex].issues[issueIndex];
      const visitsHtml = issue.visits.length
        ? issue.visits.map((visit, index) => `
            <div class="visit">
              <div class="visit-header">
                <strong>Meeting ${index + 1}</strong>
                <span class="status-pill ${issue.status === "resolved" ? "resolved" : "current"}">${issue.status === "resolved" ? "Resolved" : "Current"}</span>
              </div>

              <div class="meta">
                <div><strong>Date:</strong> ${escapeHtml(visit.date || "—")}</div>
                <div><strong>People:</strong> ${escapeHtml(visit.people || "—")}</div>
                <div><strong>Location:</strong> ${escapeHtml(visit.location || "—")}</div>
                <div><strong>Type:</strong> ${escapeHtml(visit.type || "—")}</div>
                <div><strong>Notes:</strong> ${escapeHtml(visit.notes || "No notes")}</div>
              </div>

              <div class="visit-actions">
                <button class="mini-btn" onclick="editVisit(${lineIndex}, ${issueIndex}, ${index})">Edit</button>
                <button class="danger-btn" onclick="deleteVisit(${lineIndex}, ${issueIndex}, ${index})">Delete</button>
              </div>
            </div>
          `).join("")
        : "<p>No meetings logged yet.</p>";

      openModal(`
        <h2>${escapeHtml(issue.title)}</h2>

        <div class="meta">
          <div><strong>Line:</strong> ${escapeHtml(state.lines[lineIndex].name)}</div>
          <div><strong>ESN:</strong> ${escapeHtml(issue.esn || "—")}</div>
          <div><strong>Station:</strong> ${escapeHtml(issue.station || "—")}</div>
          <div><strong>Status:</strong> ${issue.status === "resolved" ? "Resolved" : "Current"}</div>
          <div><strong>Description:</strong> ${escapeHtml(issue.description || "No description provided.")}</div>
        </div>

        <h3>Meetings</h3>
        ${visitsHtml}

        <div class="button-row">
          <button class="primary-btn" onclick="addVisit(${lineIndex}, ${issueIndex})">+ Meeting</button>
          <button class="secondary-btn" onclick="closeModal()">Close</button>
        </div>
      `);
    }

    function editVisit(lineIndex, issueIndex, visitIndex) {
      const visit = state.lines[lineIndex].issues[issueIndex].visits[visitIndex];

      openModal(`
        <h2>Edit Meeting</h2>

        <div class="form-grid">
          <div>
            <label for="visitDate">Date</label>
            <input id="visitDate" type="text" value="${escapeHtml(visit.date)}" />
          </div>

          <div>
            <label for="visitPeople">People</label>
            <input id="visitPeople" type="text" value="${escapeHtml(visit.people)}" />
          </div>

          <div>
            <label for="visitLocation">Location</label>
            <input id="visitLocation" type="text" value="${escapeHtml(visit.location)}" />
          </div>

          <div>
            <label for="visitType">Type</label>
            <input id="visitType" type="text" value="${escapeHtml(visit.type)}" />
          </div>

          <div class="full">
            <label for="visitNotes">Notes</label>
            <textarea id="visitNotes">${escapeHtml(visit.notes)}</textarea>
          </div>
        </div>

        <div class="button-row">
          <button class="primary-btn" onclick="saveVisitEdit(${lineIndex}, ${issueIndex}, ${visitIndex})">Save</button>
          <button class="secondary-btn" onclick="closeModal()">Cancel</button>
        </div>
      `);
    }

    function saveVisitEdit(lineIndex, issueIndex, visitIndex) {
      const visit = state.lines[lineIndex].issues[issueIndex].visits[visitIndex];

      visit.date = document.getElementById("visitDate").value.trim();
      visit.people = document.getElementById("visitPeople").value.trim();
      visit.location = document.getElementById("visitLocation").value.trim();
      visit.type = document.getElementById("visitType").value.trim();
      visit.notes = document.getElementById("visitNotes").value.trim();

      closeModal();
      render();
    }

    function deleteVisit(lineIndex, issueIndex, visitIndex) {
      if (!confirm("Delete this meeting?")) return;

      state.lines[lineIndex].issues[issueIndex].visits.splice(visitIndex, 1);
      render();
      closeModal();
    }

    function clearSearch() {
      state.searchQuery = "";
      document.getElementById("globalSearch").value = "";
      renderSearchResults();
    }

    document.getElementById("globalSearch").addEventListener("input", function (e) {
      state.searchQuery = e.target.value;
      renderSearchResults();
    });

    document.querySelectorAll(".view-btn").forEach(btn => {
      btn.addEventListener("click", function () {
        setView(this.dataset.view);
      });
    });

    loadData();
    render();
  </script>
</body>
</html>
